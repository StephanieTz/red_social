# Producción / EC2:   docker compose up -d --build
# Con BD local:       docker compose --profile localdb up -d --build
#                     (y en .env: DATABASE_URL=DIRECT_URL=postgresql://red:red@db:5432/red_social)
services:
  app:
    build: .
    container_name: red_social_app
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=4000
    ports:
      - "4000:4000"          # con nginx delante, cámbialo a "127.0.0.1:4000:4000"
    volumes:
      - ./storage:/app/storage   # solo se usa si STORAGE_DRIVER=local

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    container_name: red_social_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: red
      POSTGRES_PASSWORD: red
      POSTGRES_DB: red_social
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
