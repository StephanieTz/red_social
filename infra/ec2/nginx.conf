# /etc/nginx/sites-available/red_social   (reemplaza TU-DOMINIO)
#   sudo ln -s /etc/nginx/sites-available/red_social /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU-DOMINIO        ← añade HTTPS y renovación automática
# Después, en .env:  HTTPS=true  TRUST_PROXY=1   y   docker compose up -d
server {
    listen 80;
    server_name TU-DOMINIO;

    client_max_body_size 60m;   # un poco más que MAX_VIDEO_MB (videos cortos)

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;                       # imprescindible: el anti-CSRF compara Origin con Host
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
